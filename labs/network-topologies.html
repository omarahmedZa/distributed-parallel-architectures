<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="description" content="Lab — Network Topologies Visualizer. Part of the Distributed and Parallel Architectures course: objectives, mechanisms, trade-offs, limitations/scalability, research problems, and research activities.">
<title>Lab — Network Topologies Visualizer</title>
<link rel="stylesheet" href="../assets/lesson.css?v=5"><link rel="stylesheet" href="../assets/figures.css?v=5">
</head>
<body data-page="lab" data-lesson="lab-topo">
<main>
<nav class="topline"><a href="../index.html">← Course map</a><span class="pill">Lab</span></nav>
<header class="masthead">
  <p class="kicker">Interactive demo · connects to Lecture 3</p>
  <h1>Network Topologies Visualizer</h1>
  <p class="objective">Compare Mesh, Torus, Fat-Tree, and Hypercube structures and reason about diameter, degree, and bisection/communication trade-offs.</p>
</header>

<h2>Select a topology</h2>
<div class="fig">
  <div class="fig-controls">
    <label>Topology
      <select id="topo">
        <option value="mesh">2D Mesh</option>
        <option value="torus">2D Torus</option>
        <option value="fattree">Fat-Tree (illustrative)</option>
        <option value="hypercube">Hypercube (3-cube)</option>
      </select>
    </label>
  </div>
  <svg id="svg" viewBox="0 0 720 320" role="img" aria-label="Topology diagram"></svg>
  <div class="table-wrap"><table id="props"></table></div>
  <figcaption>Topologies trade diameter, bisection bandwidth, degree, wiring cost, and suitability for different traffic patterns.</figcaption>
</div>

<script>
(function(){
  const svg=document.getElementById('svg'), props=document.getElementById('props'), sel=document.getElementById('topo');
  function draw(){
    const t=sel.value; let nodes='', links='', html='';
    if(t==='mesh'){
      const g=4, ox=220, oy=60, s=70;
      for(let r=0;r<g;r++)for(let c=0;c<g;c++){
        const x=ox+c*s,y=oy+r*s;
        if(c<g-1) links+=`<line x1="${x}" y1="${y}" x2="${x+s}" y2="${y}" stroke="var(--ink-faint)"/>`;
        if(r<g-1) links+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+s}" stroke="var(--ink-faint)"/>`;
        nodes+=`<circle cx="${x}" cy="${y}" r="10" fill="var(--card)" stroke="var(--accent)"/>`;
      }
      html=`<tr><th>Property</th><th>2D Mesh (4×4)</th></tr><tr><td>Degree</td><td>2–4 (corners/edges/interior)</td></tr><tr><td>Diameter</td><td>6 hops (corner to corner)</td></tr><tr><td>Strengths</td><td>Simple, regular, good locality mapping</td></tr><tr><td>Limitations</td><td>Higher diameter, limited bisection bandwidth</td></tr>`;
    } else if(t==='torus'){
      const g=4, ox=220, oy=70, s=65;
      links+=`<rect x="${ox-10}" y="${oy-10}" width="${(g-1)*s+20}" height="${(g-1)*s+20}" rx="14" fill="none" stroke="var(--accent-2)" stroke-dasharray="5 4"/>`;
      for(let r=0;r<g;r++)for(let c=0;c<g;c++){
        const x=ox+c*s,y=oy+r*s;
        if(c<g-1) links+=`<line x1="${x}" y1="${y}" x2="${x+s}" y2="${y}" stroke="var(--ink-faint)"/>`;
        if(r<g-1) links+=`<line x1="${x}" y1="${y}" x2="${x}" y2="${y+s}" stroke="var(--ink-faint)"/>`;
        nodes+=`<circle cx="${x}" cy="${y}" r="9" fill="var(--card)" stroke="var(--accent)"/>`;
      }
      html=`<tr><th>Property</th><th>2D Torus (4×4)</th></tr><tr><td>Degree</td><td>4 (uniform)</td></tr><tr><td>Diameter</td><td>4 hops (with wraparound)</td></tr><tr><td>Strengths</td><td>Lower diameter and symmetry vs mesh</td></tr><tr><td>Limitations</td><td>Wraparound wiring/cost and routing complexity</td></tr>`;
    } else if(t==='fattree'){
      links+=`<line x1="360" y1="60" x2="220" y2="120" stroke="var(--ink-faint)"/><line x1="360" y1="60" x2="360" y2="120" stroke="var(--ink-faint)"/><line x1="360" y1="60" x2="500" y2="120" stroke="var(--ink-faint)"/>`;
      [220,360,500].forEach((x,i)=>{[ -60,-20,20,60].slice(0,2+i%2?2:2);});
      const leaf=[120,180,240,300,360,420,480,540];
      leaf.forEach((x)=>{const sw = x<280?220:x<440?360:500; links+=`<line x1="${sw}" y1="140" x2="${x}" y2="220" stroke="var(--ink-faint)"/>`; nodes+=`<circle cx="${x}" cy="230" r="8" fill="var(--card)" stroke="var(--rule)"/>`;});
      [220,360,500].forEach(x=>nodes+=`<rect x="${x-22}" y="120" width="44" height="20" rx="4" fill="var(--card)" stroke="var(--rule)"/>`);
      nodes+=`<rect x="330" y="40" width="60" height="22" rx="4" fill="var(--accent-soft)" stroke="var(--accent)"/>`;
      html=`<tr><th>Property</th><th>Fat-Tree (illustrative)</th></tr><tr><td>Structure</td><td>Multi-level switches with higher aggregate bandwidth upward</td></tr><tr><td>Strengths</td><td>High bisection bandwidth, good for collectives/all-to-all</td></tr><tr><td>Limitations</td><td>Switch/cabling cost and potential oversubscription</td></tr><tr><td>Use cases</td><td>HPC clusters and data-center networks</td></tr>`;
    } else {
      // 3-cube
      const A=[[200,80],[320,80],[200,200],[320,200]], B=[[260,130],[380,130],[260,250],[380,250]];
      const e=[[0,1],[0,2],[1,3],[2,3]];
      e.forEach(([i,j])=>links+=`<line x1="${A[i][0]}" y1="${A[i][1]}" x2="${A[j][0]}" y2="${A[j][1]}" stroke="var(--ink-faint)"/>`);
      e.forEach(([i,j])=>links+=`<line x1="${B[i][0]}" y1="${B[i][1]}" x2="${B[j][0]}" y2="${B[j][1]}" stroke="var(--ink-faint)"/>`);
      for(let i=0;i<4;i++) links+=`<line x1="${A[i][0]}" y1="${A[i][1]}" x2="${B[i][0]}" y2="${B[i][1]}" stroke="var(--ink-faint)"/>`;
      [...A,...B].forEach(p=>nodes+=`<circle cx="${p[0]}" cy="${p[1]}" r="9" fill="var(--card)" stroke="var(--accent)"/>`);
      html=`<tr><th>Property</th><th>Hypercube (3-cube, 8 nodes)</th></tr><tr><td>Degree</td><td>3 (log₂N)</td></tr><tr><td>Diameter</td><td>3 hops</td></tr><tr><td>Strengths</td><td>Low diameter, rich connectivity</td></tr><tr><td>Limitations</td><td>Degree/wiring complexity grows with size</td></tr>`;
    }
    svg.innerHTML = `<rect x="0" y="0" width="720" height="320" fill="transparent"/>${links}${nodes}`;
    props.innerHTML = html;
  }
  sel.addEventListener('change',draw); draw();
})();
</script>

<div class="next"><p>Return to <a href="../lessons/003-interconnection-networks-and-communication.html">Lecture 3</a>.</p></div>
</main>
<script src="../assets/course.js?v=5" defer></script>
</body>
</html>
